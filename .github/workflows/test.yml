name: Test and Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pip-audit
          if [ -f vedium_core/requirements.txt ]; then
              pip install -r vedium_core/requirements.txt
          fi

      - name: Lint (syntax errors block build)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
              --exclude=.git,__pycache__,node_modules,vedium_core/vedium_core/public/vedium_assets,docs/archive,scripts/migrations/oneshot

      - name: Lint (style — warnings only)
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 \
              --statistics \
              --exclude=.git,__pycache__,node_modules,vedium_core/vedium_core/public/vedium_assets,docs/archive,scripts/migrations/oneshot

      # Vulnerabilidades em dependências bloqueiam o merge.
      # Para suprimir um CVE específico (com justificativa): use --ignore-vuln.
      - name: Security audit (pip-audit)
        run: pip-audit --strict

      - name: Detect leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Testes "pure" — sem dependência de Frappe bench.
      # Cobrem lógica isolada: cupom, assinatura HMAC, helpers puros.
      - name: Unit tests (sem Frappe bench)
        run: |
          if compgen -G "vedium_core/vedium_core/tests/test_pure_*.py" > /dev/null; then
              pytest -v vedium_core/vedium_core/tests/test_pure_*.py
          else
              echo "::error::Nenhum teste 'pure' encontrado — CI deveria rodar pelo menos os testes isolados."
              exit 1
          fi
