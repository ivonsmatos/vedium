name: Public E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * *"

jobs:
  public-funnel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright
          python -m playwright install --with-deps chromium

      - name: Run public funnel E2E
        env:
          VEDIUM_RUN_PUBLIC_E2E: "1"
          VEDIUM_PUBLIC_E2E_URL: "https://vediums.com"
        run: pytest -q vedium_core/vedium_core/tests/test_pure_public_e2e_playwright.py
