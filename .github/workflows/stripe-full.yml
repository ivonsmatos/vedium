name: Stripe Full Audit + Sync (server-side)
# Extrai STRIPE_SECRET_KEY do Frappe site_config no servidor.
# A chave nunca aparece em logs — e mascarada imediatamente.
# Executa: auditoria completa -> matriz -> (se --apply) criacao de Prices.
#
# Modo padrao: somente auditoria (read-only).
# Para criar Prices: apos revisar os artefatos, dispatche novamente
# com apply=true e approved_json preenchido.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "audit (so leitura) ou apply (cria Prices aprovados)"
        required: true
        default: "audit"
        type: choice
        options:
          - audit
          - apply
      approved_json_b64:
        description: "Base64 do approved_matrix.json (somente modo apply)"
        required: false
        type: string

jobs:
  stripe-full:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Install dependencies
        run: pip install stripe --quiet

      - name: Copy scripts to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az \
            scripts/vedium_stripe_audit.py \
            scripts/vedium_stripe_sync.py \
            scripts/stripe_ops.py \
            scripts/stripe_ops_env.py \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/vedium/scripts/"
          rsync -az \
            vedium_core/vedium_core/scripts/oneshot/get_stripe_config.py \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/vedium/vedium_core/vedium_core/scripts/oneshot/"

      - name: Get Frappe data + extract masked Stripe key
        id: frappe_data
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # 1. Coletar dados do Frappe (cursos, planos)
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -se << 'REMOTE'
          set -euo pipefail
          CONTAINER=vedium-frappe
          SITE=app.vediums.com

          docker cp /opt/vedium/vedium_core/vedium_core/scripts/oneshot/get_stripe_config.py \
            "$CONTAINER":/tmp/get_stripe_config.py

          docker exec -w /home/frappe/frappe-bench "$CONTAINER" \
            bench --site "$SITE" execute \
            vedium_core.scripts.oneshot.get_stripe_config.run \
            > /tmp/frappe_stripe_config.json 2>&1

          echo "Frappe data: $(wc -l < /tmp/frappe_stripe_config.json) linhas"
          REMOTE

          # 2. Baixar dados do Frappe
          scp "$DEPLOY_USER@$DEPLOY_HOST:/tmp/frappe_stripe_config.json" ./

          echo "Linhas no JSON: $(wc -l < frappe_stripe_config.json)"

          # 3. Extrair Stripe key do site_config (sem logar o valor)
          STRIPE_KEY=$(ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker exec -w /home/frappe/frappe-bench vedium-frappe \
             python3 -c \"
import sys, json
sys.path.insert(0,'/home/frappe/frappe-bench/apps/frappe')
import frappe
frappe.init(site='app.vediums.com', sites_path='/home/frappe/frappe-bench/sites')
frappe.connect()
key = frappe.conf.get('STRIPE_SECRET_KEY') or ''
print(key)
\"" 2>/dev/null || echo "")

          # Mascarar ANTES de qualquer uso posterior
          if [ -n "$STRIPE_KEY" ]; then
            echo "::add-mask::$STRIPE_KEY"
            echo "STRIPE_KEY=$STRIPE_KEY" >> $GITHUB_ENV
            echo "key_found=true" >> $GITHUB_OUTPUT
            echo "Stripe key: presente (mascarada)"
          else
            echo "key_found=false" >> $GITHUB_OUTPUT
            echo "::error::STRIPE_SECRET_KEY nao encontrada no Frappe site_config."
            exit 1
          fi

      - name: Run Stripe audit (read-only)
        if: steps.frappe_data.outputs.key_found == 'true'
        env:
          STRIPE_SECRET_KEY: ${{ env.STRIPE_KEY }}
        run: |
          python3 scripts/vedium_stripe_audit.py \
            --frappe-json frappe_stripe_config.json \
            --output stripe_audit_result.json

      - name: Display matrix summary
        if: always() && steps.frappe_data.outputs.key_found == 'true'
        run: |
          python3 -c "
          import json, sys
          try:
              with open('stripe_audit_result.json') as f:
                  data = json.load(f)
          except:
              print('Arquivo nao encontrado')
              sys.exit(0)
          matrix = data.get('matrix', [])
          from collections import Counter
          counts = Counter(r.get('status') for r in matrix)
          print(f'Total linhas: {len(matrix)}')
          print()
          for st, n in sorted(counts.items()):
              print(f'  {st}: {n}')
          print()
          non_ok = [r for r in matrix if r.get('status') not in ('APROVADO','NAO COMERCIAL')]
          if non_ok:
              print(f'Itens que precisam de acao ({len(non_ok)}):')
              for r in non_ok:
                  issues = '; '.join(r.get('issues') or [])[:80]
                  print(f\"  [{r.get('status','')}] {r.get('course_title','?'):<28} / {r.get('period','?'):<8}: {issues}\")
          else:
              print('Todos os itens comerciais estao APROVADOS.')
          "

      - name: Apply sync (only in apply mode, after approval)
        if: >
          github.event.inputs.mode == 'apply' &&
          github.event.inputs.approved_json_b64 != '' &&
          steps.frappe_data.outputs.key_found == 'true'
        env:
          STRIPE_SECRET_KEY: ${{ env.STRIPE_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Decodificar o approved_matrix.json aprovado pelo operador
          echo "${{ github.event.inputs.approved_json_b64 }}" | base64 -d > approved_matrix.json
          echo "approved_matrix.json decodificado:"
          python3 -c "
          import json
          with open('approved_matrix.json') as f:
              d = json.load(f)
          entries = d if isinstance(d, list) else d.get('approved', [])
          approved = [e for e in entries if e.get('approved')]
          print(f'  Entradas aprovadas: {len(approved)}')
          for e in approved:
              print(f\"  {e.get('course_id','?')} / {e.get('period','?')}: {e.get('unit_amount',0)/100:.2f} {e.get('currency','?')} (fonte: {e.get('value_source','?')})\")
          "

          # Dry-run primeiro (obrigatorio)
          python3 scripts/vedium_stripe_sync.py \
            --frappe-json frappe_stripe_config.json \
            --approved-json approved_matrix.json \
            --dry-run \
            --all \
            --output stripe_sync_dryrun.json

          echo "Dry-run concluido. Aplicando..."

          # Apply real
          python3 scripts/vedium_stripe_sync.py \
            --frappe-json frappe_stripe_config.json \
            --approved-json approved_matrix.json \
            --apply \
            --all \
            --rollback-mapping rollback_mapping.json \
            --output stripe_sync_result.json \
            --frappe-container vedium-frappe \
            --site app.vediums.com

      - name: Upload all artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stripe-full-${{ github.run_id }}-${{ github.event.inputs.mode }}
          path: |
            frappe_stripe_config.json
            stripe_audit_result.json
            stripe_sync_dryrun.json
            stripe_sync_result.json
            rollback_mapping.json
            approved_matrix.json
          retention-days: 14
          if-no-files-found: warn
