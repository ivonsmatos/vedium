# Vedium LMS - Backup Production
# Backup nativo do Frappe (bench backup --with-files) no servidor +
# cópia offsite baixada como artifact do GitHub (retida 90 dias).
# Não depende de restic/S3 — usa as credenciais do próprio site.

name: Backup Production

on:
  schedule:
    - cron: "0 2 * * *" # diário às 02:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run Frappe backup on server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SITE: ${{ vars.SITE_NAME || 'app.vediums.com' }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -se <<REMOTE
          set -euo pipefail
          echo "📦 Backup do site $SITE..."
          docker exec vedium-frappe bench --site "$SITE" backup --with-files
          rm -rf /tmp/vedium-backup && mkdir -p /tmp/vedium-backup
          docker cp "vedium-frappe:/home/frappe/frappe-bench/sites/$SITE/private/backups/." /tmp/vedium-backup/
          tar czf /tmp/vedium-backup.tgz -C /tmp/vedium-backup .
          echo "✅ Backup empacotado:"
          ls -lh /tmp/vedium-backup.tgz
          REMOTE

      - name: Download backup to runner (cópia offsite)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST:/tmp/vedium-backup.tgz" ./vedium-backup.tgz
          ls -lh ./vedium-backup.tgz

      - name: Upload artifact (retido 90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: vedium-backup-${{ github.run_id }}
          path: ./vedium-backup.tgz
          retention-days: 90

      - name: Cleanup temp do servidor
        if: always()
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf /tmp/vedium-backup /tmp/vedium-backup.tgz" || true
