name: Catalog Audit

on:
  workflow_dispatch:

jobs:
  audit-course-levels:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Audit English course levels in production
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SITE_NAME: ${{ vars.SITE_NAME || 'app.vediums.com' }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -se <<REMOTE
          set -euo pipefail
          docker exec -w /home/frappe/frappe-bench vedium-frappe \
            bench --site "$SITE_NAME" execute vedium_core.catalog_audit.audit_course_levels
          REMOTE
