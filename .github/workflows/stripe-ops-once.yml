name: Stripe Ops (one-shot dispatch)
# Executa operações Stripe diretamente no servidor de produção.
# A SECRET KEY é passada como input de dispatch (mascarada pelo GitHub).
# Após o uso, este workflow pode ser removido do repositório.

on:
  workflow_dispatch:
    inputs:
      stripe_key:
        description: "Stripe Secret Key (sk_live_...)"
        required: true
        type: string

jobs:
  stripe-ops:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mask stripe key
        run: echo "::add-mask::${{ inputs.stripe_key }}"

      - name: Setup SSH
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy scripts to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az scripts/stripe_ops.py scripts/stripe_ops_env.py \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/vedium/scripts/"

      - name: Run Stripe operations on server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          STRIPE_SECRET_KEY: ${{ inputs.stripe_key }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -se << REMOTE
          set -euo pipefail

          # Instalar stripe SDK se necessário
          pip install stripe --quiet 2>/dev/null || pip3 install stripe --quiet 2>/dev/null || true

          export STRIPE_SECRET_KEY="${STRIPE_SECRET_KEY}"
          cd /opt/vedium
          python3 scripts/stripe_ops_env.py
          REMOTE

      - name: Collect results
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          scp "$DEPLOY_USER@$DEPLOY_HOST:/opt/vedium/scripts/stripe_ops_result.json" \
              stripe_ops_result.json 2>/dev/null || echo "Arquivo de resultado não encontrado."
          if [ -f stripe_ops_result.json ]; then
            echo "=== RESULTADO ==="
            python3 -c "
          import json
          with open('stripe_ops_result.json') as f:
              data = json.load(f)
          print('Timestamp:', data.get('timestamp'))
          print('Sessões expiradas:', len(data.get('expired_sessions', [])))
          print('Sessões open auditadas:', data.get('open_sessions_audited'))
          print('Sessões open com problema:', data.get('open_sessions_with_issues'))
          print('Portal:', data.get('portal'))
          total = len(data.get('checkout_tests', []))
          ok = sum(1 for r in data.get('checkout_tests', []) if r.get('ok'))
          print(f'Checkout tests: {ok}/{total} OK')
          for r in data.get('checkout_tests', []):
              status = '✅' if r.get('ok') else '❌'
              print(f\"  {status} {r.get('produto','?')} [{r.get('plano','?')}] price={r.get('price_id','?')} valor={r.get('valor','?')} {r.get('moeda','?')}\")
          print('VEREDITO:', data.get('verdict'))
          "
          fi
