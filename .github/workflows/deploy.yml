name: Deploy to Production
# Secrets necessários (Settings → Secrets → Actions):
#   SSH_PRIVATE_KEY  — chave privada SSH
#   SSH_KNOWN_HOSTS  — saída de: ssh-keyscan <DEPLOY_HOST>
#   DEPLOY_USER      — usuário SSH
#   DEPLOY_HOST      — IP/hostname do servidor
#   ENV_FILE         — conteúdo completo do deploy/.env (copiar o arquivo local)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}



      # Sincroniza o repositório (necessário para o app Frappe em vedium_core).
      # --omit-dir-times evita "failed to set times on /opt/vedium/." quando o
      # DEPLOY_USER não é dono do diretório raiz.
      # --exclude='/site' protege o diretório servido pelo nginx (vediums.com),
      # que é publicado no passo seguinte — sem isso, o --delete tentaria apagá-lo.
      - name: Sync code to server (app Frappe)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --delete --omit-dir-times -e "ssh -o StrictHostKeyChecking=no" \
            --include='vedium_core/vedium_core/public/legal/*.pdf' \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='docker-compose.yml' \
            --exclude='.env' \
            --exclude='/site' \
            --exclude='idiomas' \
            --exclude='*.pdf' \
            --exclude='*.epub' \
            --exclude='*.mobi' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/vedium/"

      # Publica o site institucional no caminho que o nginx serve de fato
      # (root /opt/vedium/site;). A barra final em deploy/site/ envia o CONTEÚDO
      # da pasta para /opt/vedium/site/. Requer que o DEPLOY_USER tenha permissão
      # de escrita nesse diretório (rodar uma vez no servidor:
      #   sudo chown -R "$DEPLOY_USER" /opt/vedium ).
      - name: Publish marketing site (vediums.com)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --delete --omit-dir-times -e "ssh -o StrictHostKeyChecking=no" \
            deploy/site/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/vedium/site/"

      # O .env contém senhas reais (Redis, MariaDB, etc.) e NUNCA entra no git.
      # Ele é guardado como GitHub Secret ENV_FILE e copiado para o servidor a
      # cada deploy, garantindo que o servidor sempre tenha as senhas atualizadas.
      # Para atualizar: Settings → Secrets → Actions → ENV_FILE → editar.
      - name: Deploy .env to server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          echo "$ENV_FILE" | ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            'cat > /opt/vedium/deploy/.env && chmod 600 /opt/vedium/deploy/.env'
          echo "✅ .env atualizado no servidor"

      - name: Run deploy commands
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SITE_NAME: ${{ vars.SITE_NAME || 'app.vediums.com' }}
        run: |
          ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" bash -se << REMOTE
          set -euo pipefail

          CONTAINER=vedium-frappe
          TARGET_DIR=/opt/vedium

          echo "🐍 Sincronizando vedium_core no container..."
          docker exec -u root "\$CONTAINER" rm -rf /home/frappe/frappe-bench/apps/vedium_core
          docker cp "\$TARGET_DIR/vedium_core" "\$CONTAINER":/home/frappe/frappe-bench/apps/
          docker exec -u root "\$CONTAINER" chown -R frappe:frappe /home/frappe/frappe-bench/apps/vedium_core

          echo "📦 Crítico: instalar app + migrar banco (cria os doctypes)..."
          docker exec -w /home/frappe/frappe-bench "\$CONTAINER" pip install -e apps/vedium_core
          docker exec -w /home/frappe/frappe-bench "\$CONTAINER" \
              bench --site "$SITE_NAME" install-app vedium_core || echo "ℹ️ App já instalado"
          docker exec -w /home/frappe/frappe-bench "\$CONTAINER" \
              bench --site "$SITE_NAME" migrate



          # Assets: npm/bench build são não-críticos — o CSS/JS já compilado
          # no volume persiste entre deploys. Se o build falhar (ex: Node.js
          # incompatível, esbuild segfault), o Python code novo ainda funciona.
          # Isso evita que um erro de asset aborte o restart/healthcheck.
          echo "🎨 Assets (não-crítico — build do frontend)..."
          docker exec -w /home/frappe/frappe-bench/apps/vedium_core "\$CONTAINER" npm install --no-audit --no-fund \
              || echo "⚠️ npm install falhou (assets — não-crítico)"
          docker exec -w /home/frappe/frappe-bench/apps/vedium_core "\$CONTAINER" npm run build-css \
              || echo "⚠️ build-css falhou (assets — não-crítico)"
          docker exec -w /home/frappe/frappe-bench "\$CONTAINER" \
              bench --site "$SITE_NAME" build --app vedium_core \
              || echo "⚠️ bench build falhou (assets — não-crítico)"

          echo "♻️ Limpando cache..."
          docker exec -w /home/frappe/frappe-bench "\$CONTAINER" \
              bench --site "$SITE_NAME" clear-cache
          docker exec -w /home/frappe/frappe-bench "\$CONTAINER" \
              bench --site "$SITE_NAME" clear-website-cache

          # Gunicorn NÃO recarrega .py sozinho (footgun documentado no
          # RUNBOOK) — sem este restart, o servidor segue com código antigo.
          echo "🔄 Reiniciando container (recarrega gunicorn com o código novo)..."
          docker restart "\$CONTAINER"

          echo "⏳ Aguardando o container voltar saudável..."
          for i in \$(seq 1 30); do
              status=\$(docker inspect -f '{{.State.Health.Status}}' "\$CONTAINER" 2>/dev/null || echo unknown)
              [ "\$status" = "healthy" ] && break
              sleep 5
          done
          echo "Healthcheck: \$status"
          [ "\$status" = "healthy" ] || { echo "::error::Container não voltou healthy após restart"; exit 1; }

          # Os workers de fila (RQ) e o scheduler compartilham o MESMO volume
          # de código que vedium-frappe (mesmo hooks.py, mesmo timestamp) —
          # mas são processos Python de LONGA duração que só carregam os
          # módulos uma vez na memória. Sem reiniciá-los, e-mails, sync com
          # CRM e qualquer frappe.enqueue() continuam rodando com o código/
          # estado de semanas atrás mesmo após o deploy trocar os arquivos.
          # Achado do QA 2026-07-01: workers ficaram "Up 4 weeks" enquanto
          # só vedium-frappe era reiniciado a cada deploy — e um e-mail de
          # matrícula falhou com ModuleNotFoundError num worker desatualizado.
          echo "🔄 Reiniciando workers de fila e scheduler..."
          for WORKER in vedium-worker-short vedium-worker-long vedium-worker-default vedium-scheduler; do
              docker restart "\$WORKER" || echo "⚠️ restart de $WORKER falhou (revisar)"
          done
          echo "⏳ Aguardando os workers voltarem saudáveis..."
          for WORKER in vedium-worker-short vedium-worker-long vedium-worker-default vedium-scheduler; do
              for i in \$(seq 1 30); do
                  wstatus=\$(docker inspect -f '{{.State.Health.Status}}' "\$WORKER" 2>/dev/null || echo unknown)
                  [ "\$wstatus" = "healthy" ] && break
                  sleep 5
              done
              echo "  \$WORKER: \$wstatus"
          done
          
          # Portão de saúde: health.run faz raise SystemExit(1) se algum check
          # CRÍTICO (db, scheduler, stripe.config, lms) quebrar. Sob pipefail,
          # isso aborta o deploy — "verde" passa a significar app operacional.
          # Checks externos flaky (stripe.catalog, brevo, raven, e-mail, fila)
          # são critical=False → viram aviso, não derrubam o deploy.
          echo "🩺 Portão de saúde (health check crítico)..."
          docker exec -w /home/frappe/frappe-bench "\$CONTAINER" \
              bench --site "$SITE_NAME" execute vedium_core.health.run

          echo "=========================================================="
          echo "Executando backup obrigatório (antes do import_manifest)..."
          echo "=========================================================="
          docker exec -w /home/frappe/frappe-bench "\$CONTAINER" \
              bench --site "$SITE_NAME" backup --with-files
          
          echo "=========================================================="
          echo "Rodando import_manifest com dry_run=false..."
          echo "=========================================================="
          docker exec -w /home/frappe/frappe-bench "\$CONTAINER" \
              bench --site "$SITE_NAME" execute \
              vedium_core.wiki_import.import_manifest \
              --kwargs '{"manifest_path":"wiki_content/manifest.json","dry_run":False}' || true
          
          echo "=========================================================="
          echo "Buscando os ultimos erros do Frappe no banco para debug:"
          echo "=========================================================="
          docker exec -w /home/frappe/frappe-bench "\$CONTAINER" \
              bench --site "$SITE_NAME" mariadb -e "SELECT creation, method, error FROM \\\`tabError Log\\\` ORDER BY creation DESC LIMIT 5;" || true
              
          echo "✅ Deploy finalizado."
          REMOTE

      - name: Smoke test
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://vediums.com' }}
        run: |
          sleep 10
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for url in "$SITE_URL" "https://app.vediums.com"; do
              code=$(curl -skI -o /dev/null -w '%{http_code}' --max-time 30 -A "$UA" "$url")
              echo "$url → HTTP $code"
              # 403 = Cloudflare desafiando o runner (anti-bot), origem está no ar; aceitamos como alcançável
              case "$code" in
                200|301|302|403) echo "  ok (alcançável)";;
                *) echo "::error::$url retornou $code"; exit 1;;
              esac
          done
