# Vedium LMS - Security Monitoring
# Runs daily to check security status

name: Security Check

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 6:00 AM UTC
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Run security monitor
        run: |
          echo "🔒 Running security check on production server..."
          ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "sudo /opt/vedium/deploy/scripts/security-monitor.sh"

      - name: Check SSL expiration
        run: |
          echo "🔐 Checking SSL certificate..."
          EXPIRY=$(echo | openssl s_client -servername vediums.com -connect vediums.com:443 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s)
          NOW_EPOCH=$(date +%s)
          DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))

          echo "Certificate expires in $DAYS_LEFT days"

          if [ "$DAYS_LEFT" -lt 14 ]; then
            echo "::warning::SSL certificate expires in $DAYS_LEFT days!"
          fi

      - name: Check website availability
        run: |
          for URL in "https://vediums.com" "https://app.vediums.com"; do
            HTTP_CODE=$(curl -skI "$URL" -o /dev/null -w '%{http_code}' --max-time 30)
            if [ "$HTTP_CODE" == "200" ]; then
              echo "✅ $URL - OK"
            else
              echo "::error::$URL returned HTTP $HTTP_CODE"
            fi
          done

      # Regressão histórica: o LMS já quebrou com GET=200 mas POST=404
      # (Origin/Host mismatch no rewrite do nginx). curl simples sem Origin
      # mascarava o bug — este check reproduz o que o navegador envia.
      - name: Check LMS POST with Origin (regression guard)
        run: |
          HTTP_CODE=$(curl -sk -X POST \
            -H "Origin: https://app.vediums.com" \
            -H "Content-Type: application/json" \
            -o /dev/null -w '%{http_code}' --max-time 30 \
            "https://app.vediums.com/api/method/ping")
          echo "POST /api/method/ping (com Origin) → HTTP $HTTP_CODE"
          # 200 = ok; 403 = CSRF de guest (aceitável — rota respondeu)
          case "$HTTP_CODE" in
            200|403) echo "✅ POST com Origin respondido pelo Frappe";;
            404) echo "::error::POST retornou 404 — provável regressão do Host-rewrite (ver RUNBOOK)"; exit 1;;
            *) echo "::warning::POST retornou $HTTP_CODE (inesperado, verificar)";;
          esac

  backup-check:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Check last backup
        run: |
          echo "📦 Checking backup status..."

          LAST_BACKUP=$(ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "ls -td /opt/vedium/backups/*/ 2>/dev/null | head -1")

          if [ -z "$LAST_BACKUP" ]; then
            echo "::warning::No backups found!"
          else
            echo "Last backup: $LAST_BACKUP"
          fi

  container-health:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Check Docker containers
        run: |
          echo "🐳 Checking Docker containers..."

          CONTAINERS=$(ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "docker ps --filter 'name=vedium' --format '{{.Names}}: {{.Status}}'")

          echo "$CONTAINERS"

          RUNNING=$(echo "$CONTAINERS" | wc -l)
          if [ "$RUNNING" -lt 5 ]; then
            echo "::warning::Only $RUNNING containers running (expected: 5)"
          else
            echo "✅ All containers running"
          fi
