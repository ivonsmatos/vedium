# Vedium LMS - Configuração Completa HTTPS Híbrida (Staging)
# staging.vediums.com
# Author: Vedium Global Education
# Last Updated: 2026-08-30

# ===========================================
# STAGING HYBRID ROUTING (Next.js + Frappe)
# ===========================================
server {
    listen 80;
    listen [::]:80;
    server_name staging.vediums.com;

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.vediums.com;

    # SSL Certificates (Assumindo que staging.vediums.com tem cert)
    ssl_certificate /etc/letsencrypt/live/vediums.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vediums.com/privkey.pem;

    # SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    include /etc/nginx/snippets/vedium-security-headers.conf;

    # NOINDEX OBRIGATÓRIO EM STAGING
    add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

    # Max upload size
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/staging.vediums.com.access.log combined;
    error_log /var/log/nginx/staging.vediums.com.error.log warn;

    # ------------------------------------------------------------------
    # ASSETS NEXT.JS
    # ------------------------------------------------------------------
    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # ASSETS FRAPPE (Aulas, imagens legadas, etc)
    # ------------------------------------------------------------------
    location ~ ^/(assets|files|website_script.js)/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host app.vediums.com; # Frappe precisa do hostname correto
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # REDIRECTS (Igual produção)
    # ------------------------------------------------------------------
    location /app { return 301 https://app.vediums.com; }
    location /login { return 301 https://app.vediums.com/login; }
    location /lms { return 301 https://app.vediums.com/lms; }

    # ------------------------------------------------------------------
    # ROTAS EXPLICITAS -> FRAPPE (Blog, APIs)
    # ------------------------------------------------------------------
    location ~ ^/(blog|api/method|sobre.html|privacidade.html|termos.html) {
        proxy_pass http://127.0.0.1:8005;
        proxy_set_header Host app.vediums.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # PWA
    # ------------------------------------------------------------------
    location = /sw.js {
        proxy_pass http://127.0.0.1:8005/assets/vedium_core/js/sw.js;
        proxy_set_header Host app.vediums.com;
        add_header Content-Type "application/javascript; charset=utf-8";
    }

    # ------------------------------------------------------------------
    # ROTAS EXPLICITAS -> NEXT.JS (Fallback para Next)
    # ------------------------------------------------------------------
    # A Home, /cursos, e as rotas de Idiomas vão para o Next.js.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "STAGING OK";
        add_header Content-Type text/plain;
    }
}
