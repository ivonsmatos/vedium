# metrics.vediums.com — Grafana + Uptime Kuma (observabilidade interna)
# Pré-requisito: certbot --nginx -d metrics.vediums.com

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name metrics.vediums.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Grafana
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name metrics.vediums.com;

    ssl_certificate /etc/letsencrypt/live/metrics.vediums.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metrics.vediums.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Grafana (porta 3003)
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }
}

