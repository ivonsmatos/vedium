apiVersion: 1

# Regras de alerta — Vedium
# Pasta: Vedium Alertas
# datasourceUid Prometheus: ffn6ohk6af9j4b
# Nota: monitoramento de uptime do site é feito pelo Uptime Kuma

groups:
  - orgId: 1
    name: Vedium Alertas
    folder: Vedium Alertas
    interval: 1m
    rules:

      - uid: cpu-high-vedium
        title: "CPU alta (>85%)"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ffn6ohk6af9j4b
            model:
              expr: '100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "CPU acima de 85% no servidor"
          description: "Uso medio de CPU elevado nos ultimos 5 minutos."
        labels:
          severity: warning
          team: ops
        isPaused: false

      - uid: memory-high-vedium
        title: "Memoria alta (>90%)"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: ffn6ohk6af9j4b
            model:
              expr: "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Memoria acima de 90% no servidor"
          description: "Uso de memoria elevado."
        labels:
          severity: warning
          team: ops
        isPaused: false

      - uid: disk-high-vedium
        title: "Disco quase cheio (>85%)"
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: ffn6ohk6af9j4b
            model:
              expr: '(1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"})) * 100 > 85'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: "Disco com mais de 85% de uso"
          description: "Uso do disco / elevado."
        labels:
          severity: warning
          team: ops
        isPaused: false