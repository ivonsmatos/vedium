global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # node_exporter — métricas do host (CPU, memória, disco)
  # Roda com network_mode: host no docker-compose (perfil observability)
  # Acessível via host.docker.internal graças ao extra_hosts no prometheus
  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]
