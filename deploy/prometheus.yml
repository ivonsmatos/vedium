global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "vedium-frappe"
    metrics_path: "/api/method/vedium_core.vedium_core.api.get_metrics"
    static_configs:
      - targets: ["vedium-frappe:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # node_exporter — métricas do host (CPU, memória, disco)
  # Para ativar: docker run -d --net=host --pid=host --name node-exporter \
  #   -v /:/host:ro,rslave prom/node-exporter:latest --path.rootfs=/host
  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]
