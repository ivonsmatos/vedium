# =====================================================
# Vedium - Docker Compose para PRODUÇÃO
# =====================================================
# Pré-requisitos:
#   1. Arquivo .env preenchido (use .env.example como base)
#   2. Senhas geradas com openssl rand -base64 32
#   3. Frappe é exposto APENAS via nginx (nada externo aqui)
#
# Stack real: Frappe v16 / Python 3.14 / Node 24 / MariaDB 10.6
# =====================================================

# Bloco de variáveis reutilizáveis (YAML anchors)
x-frappe-env: &frappe-env
  FRAPPE_SITE_NAME: ${FRAPPE_SITE_NAME:-app.vediums.com}
  SITES_PATH: /home/frappe/frappe-bench/sites
  FRAPPE_STREAM_LOGGING: "1"
  DB_HOST: vedium-mariadb
  DB_PORT: "3306"
  # Redis com autenticação — REDIS_PASSWORD deve estar no .env
  REDIS_CACHE: vedium-redis-cache:6379
  REDIS_QUEUE: vedium-redis-queue:6379
  REDIS_SOCKETIO: vedium-redis-socketio:6379
  FRAPPE_REDIS_CACHE: redis://:${REDIS_PASSWORD}@vedium-redis-cache:6379
  FRAPPE_REDIS_QUEUE: redis://:${REDIS_PASSWORD}@vedium-redis-queue:6379
  FRAPPE_REDIS_SOCKETIO: redis://:${REDIS_PASSWORD}@vedium-redis-socketio:6379

x-frappe-image: &frappe-image
  image: vedium-frappe-raven:v16
  build:
    context: ..
    dockerfile: deploy/Dockerfile

x-frappe-volumes: &frappe-volumes
  - frappe-bench-v16:/home/frappe/frappe-bench
  - vedium-sites:/home/frappe/frappe-bench/sites

x-frappe-networks: &frappe-networks
  - vedium-network

x-frappe-depends: &frappe-depends
  vedium-mariadb:
    condition: service_healthy
  vedium-redis-cache:
    condition: service_healthy
  vedium-redis-queue:
    condition: service_healthy
  vedium-redis-socketio:
    condition: service_healthy

services:
  # --------------------------------------------------
  # APP: Gunicorn — serve requests HTTP
  # --------------------------------------------------
  vedium-frappe:
    <<: *frappe-image
    container_name: vedium-frappe
    restart: always
    working_dir: /home/frappe/frappe-bench
    command:
      - /home/frappe/frappe-bench/env/bin/gunicorn
      - -b
      - 0.0.0.0:8000
      - -w
      - "${GUNICORN_WORKERS:-4}"
      - -t
      - "120"
      - custom_wsgi:application
      - --preload
    environment:
      <<: *frappe-env
    # Bind apenas no localhost — nginx faz proxy reverso
    ports:
      - "127.0.0.1:8005:8000"
    volumes: *frappe-volumes
    networks: *frappe-networks
    depends_on: *frappe-depends
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "1.5"
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: app.vediums.com", "http://localhost:8000/api/method/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --------------------------------------------------
  # SOCKETIO — realtime (chat, progresso ao vivo)
  # --------------------------------------------------
  vedium-socketio:
    <<: *frappe-image
    container_name: vedium-socketio
    restart: always
    working_dir: /home/frappe/frappe-bench
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_SITE_NAME: ${FRAPPE_SITE_NAME:-app.vediums.com}
      SITES_PATH: /home/frappe/frappe-bench/sites
      REDIS_SOCKETIO: vedium-redis-socketio:6379
    ports:
      - "127.0.0.1:9000:9000"
    volumes: *frappe-volumes
    networks: *frappe-networks
    depends_on:
      vedium-frappe:
        condition: service_healthy
      vedium-redis-socketio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9000/socket.io/?EIO=4&transport=polling', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --------------------------------------------------
  # WORKERS — processam fila de jobs assíncronos
  # (emails, certificados, webhooks, relatórios pesados)
  # --------------------------------------------------
  vedium-worker-default:
    <<: *frappe-image
    container_name: vedium-worker-default
    restart: always
    working_dir: /home/frappe/frappe-bench
    command:
      - bench
      - worker
      - --queue
      - default
    environment:
      <<: *frappe-env
    volumes: *frappe-volumes
    networks: *frappe-networks
    depends_on: *frappe-depends
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os;procs=[open(f'/proc/{p}/cmdline').read() for p in os.listdir('/proc') if p.isdigit() and os.path.exists(f'/proc/{p}/cmdline')];exit(0 if any('bench' in p for p in procs) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  vedium-worker-short:
    <<: *frappe-image
    container_name: vedium-worker-short
    restart: always
    working_dir: /home/frappe/frappe-bench
    command:
      - bench
      - worker
      - --queue
      - short
    environment:
      <<: *frappe-env
    volumes: *frappe-volumes
    networks: *frappe-networks
    depends_on: *frappe-depends
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.75"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os;procs=[open(f'/proc/{p}/cmdline').read() for p in os.listdir('/proc') if p.isdigit() and os.path.exists(f'/proc/{p}/cmdline')];exit(0 if any('bench' in p for p in procs) else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  vedium-worker-long:
    <<: *frappe-image
    container_name: vedium-worker-long
    restart: always
    working_dir: /home/frappe/frappe-bench
    command:
      - bench
      - worker
      - --queue
      - long
    environment:
      <<: *frappe-env
    volumes: *frappe-volumes
    networks: *frappe-networks
    depends_on: *frappe-depends
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os;procs=[open(f'/proc/{p}/cmdline').read() for p in os.listdir('/proc') if p.isdigit() and os.path.exists(f'/proc/{p}/cmdline')];exit(0 if any('bench' in p for p in procs) else 1)\""]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # --------------------------------------------------
  # SCHEDULER — executa tarefas agendadas (cron Frappe)
  # (backups internos, limpeza de sessões, métricas)
  # --------------------------------------------------
  vedium-scheduler:
    <<: *frappe-image
    container_name: vedium-scheduler
    restart: always
    working_dir: /home/frappe/frappe-bench
    command:
      - bench
      - schedule
    environment:
      <<: *frappe-env
    volumes: *frappe-volumes
    networks: *frappe-networks
    depends_on: *frappe-depends
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os;procs=[open(f'/proc/{p}/cmdline').read() for p in os.listdir('/proc') if p.isdigit() and os.path.exists(f'/proc/{p}/cmdline')];exit(0 if any('bench' in p for p in procs) else 1)\""]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # --------------------------------------------------
  # BANCO DE DADOS — MariaDB 10.6
  # --------------------------------------------------
  vedium-mariadb:
    image: mariadb:10.6
    container_name: vedium-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vedium}
      MYSQL_USER: ${MYSQL_USER:-frappe}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
    # Sem ports: — banco acessível somente pela rede interna do Docker
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      # Performance
      - --innodb-buffer-pool-size=512M
      - --innodb-log-file-size=128M
      - --innodb-flush-log-at-trx-commit=2
      - --slow-query-log=ON
      - --long-query-time=2
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - vedium-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------
  # REDIS — 3 instâncias lógicas separadas
  # --------------------------------------------------
  vedium-redis-cache:
    image: redis/redis-stack-server:latest
    container_name: vedium-redis-cache
    restart: always
    environment:
      REDIS_ARGS: "--maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}"
    volumes:
      - redis-cache-data:/data
    networks:
      - vedium-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vedium-redis-queue:
    image: redis:7-alpine
    container_name: vedium-redis-queue
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-queue-data:/data
    networks:
      - vedium-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vedium-redis-socketio:
    image: redis:7-alpine
    container_name: vedium-redis-socketio
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-socketio-data:/data
    networks:
      - vedium-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------
  # OBSERVABILIDADE (profile: observability)
  # Ativar com: docker compose --profile observability up -d
  # --------------------------------------------------
  # Apenas Uptime Kuma localmente. Métricas/dashboards externos
  # via Grafana Cloud free + Uptime Robot (ADR-005, CHANGELOG 2026-06-11).
  vedium-uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: vedium-uptime-kuma
    profiles: ["observability"]
    restart: always
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "127.0.0.1:3004:3001"
    networks:
      - vedium-network

volumes:
  frappe-bench-v16:
    external: true
    name: vedium_frappe-bench-v16
  vedium-sites:
  mariadb-data:
  redis-cache-data:
  redis-queue-data:
  redis-socketio-data:
  uptime-kuma-data:

networks:
  vedium-network:
    driver: bridge
