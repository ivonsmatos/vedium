# =====================================================
# Vedium - Docker Compose para PRODUÇÃO
# =====================================================
# Pré-requisitos:
#   1. Arquivo .env preenchido (use .env.example como base)
#   2. Senhas geradas com openssl rand -base64 32
#   3. Frappe é exposto APENAS via nginx (nada externo aqui)
# =====================================================

services:
  vedium-frappe:
    image: frappe/erpnext:v15
    container_name: vedium-frappe
    restart: always
    working_dir: /home/frappe/frappe-bench
    command:
      - /home/frappe/frappe-bench/env/bin/gunicorn
      - -b
      - 0.0.0.0:8000
      - -w
      - "4"
      - -t
      - "120"
      - frappe.app:application
      - --preload
    environment:
      FRAPPE_SITE_NAME: ${FRAPPE_SITE_NAME:-app.vediums.com}
      DB_HOST: vedium-mariadb
      DB_PORT: "3306"
      REDIS_CACHE: vedium-redis-cache:6379
      REDIS_QUEUE: vedium-redis-queue:6379
      REDIS_SOCKETIO: vedium-redis-socketio:6379
    # Bind apenas no localhost — nginx faz proxy reverso
    ports:
      - "127.0.0.1:8005:8000"
      - "127.0.0.1:9005:9000"
    volumes:
      - frappe-bench-data:/home/frappe/frappe-bench
    networks:
      - vedium-network
    depends_on:
      - vedium-mariadb
      - vedium-redis-cache
      - vedium-redis-queue
      - vedium-redis-socketio

  vedium-mariadb:
    image: mariadb:10.6
    container_name: vedium-mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vedium}
      MYSQL_USER: ${MYSQL_USER:-frappe}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
    # Sem ports: — banco acessível somente pela rede interna do Docker
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - vedium-network

  vedium-redis-cache:
    image: redis:7-alpine
    container_name: vedium-redis-cache
    restart: always
    volumes:
      - redis-cache-data:/data
    networks:
      - vedium-network

  vedium-redis-queue:
    image: redis:7-alpine
    container_name: vedium-redis-queue
    restart: always
    volumes:
      - redis-queue-data:/data
    networks:
      - vedium-network

  vedium-redis-socketio:
    image: redis:7-alpine
    container_name: vedium-redis-socketio
    restart: always
    volumes:
      - redis-socketio-data:/data
    networks:
      - vedium-network

volumes:
  frappe-bench-data:
  mariadb-data:
  redis-cache-data:
  redis-queue-data:
  redis-socketio-data:

networks:
  vedium-network:
    driver: bridge
