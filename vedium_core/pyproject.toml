[project]
name = "vedium_core"
authors = [
    { name = "Vedium Team", email = "info@vediums.com" }
]
description = "Vedium Core App"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "mercadopago>=2.2.0",
    "openai>=1.0",
    "prometheus-client>=0.19",
    "groq>=0.5",
    "requests>=2.31",
    "stripe>=8.0,<16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "flake8>=6",
    "pip-audit>=2",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"
