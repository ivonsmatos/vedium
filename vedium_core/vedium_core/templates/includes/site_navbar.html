<header class="main-header main-header--one clearfix">
    <div class="main-header--one__top clearfix">
        <div class="container">
            <div class="main-header--one__top-inner clearfix">
                <div class="main-header--one__top-left">
                    <div class="main-header--one__top-logo">
                        <a href="/"><img src="/assets/vedium_core/vedium_assets/images/logos/logo-color-reta.png" alt="Vedium"/></a>
                    </div>
                </div>
                <div class="main-header--one__top-right clearfix">
                    <ul class="main-header--one__top-social-link list-unstyled clearfix">
                        <li><a href="https://www.instagram.com/vediumsglobal/" target="_blank" rel="noopener" aria-label="Instagram"><i class="fab fa-instagram"></i></a></li>
                        <li><a href="https://www.linkedin.com/company/vediums" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a></li>
                        <li><a href="https://wa.me/5511911293075" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a></li>
                    </ul>
                    <div class="vedium-language-switcher" aria-label="Selecionar idioma">
                        <button type="button" data-vd-lang="pt" title="Português" aria-label="Português">🇧🇷</button>
                        <button type="button" data-vd-lang="en" title="English" aria-label="English">🇺🇸</button>
                        <button type="button" data-vd-lang="es" title="Español" aria-label="Español">🇪🇸</button>
                        <button type="button" data-vd-lang="fr" title="Français" aria-label="Français">🇫🇷</button>
                        <button type="button" data-vd-lang="de" title="Deutsch" aria-label="Deutsch">🇩🇪</button>
                        <button type="button" data-vd-lang="ru" title="Русский" aria-label="Русский">🇷🇺</button>
                        <button type="button" data-vd-lang="zh-CN" title="中文" aria-label="中文">🇨🇳</button>
                    </div>
                    <div class="main-header--one__top-contact-info clearfix">
                        <ul class="main-header--one__top-contact-info-list list-unstyled">
                            <li class="main-header--one__top-contact-info-list-item">
                                <div class="icon"><span class="icon-phone-call-1"></span></div>
                                <div class="text"><h6>Fale conosco</h6><p><a href="tel:+5511911293075">+55 (11) 91129-3075</a></p></div>
                            </li>
                            <li class="main-header--one__top-contact-info-list-item">
                                <div class="icon"><span class="icon-message"></span></div>
                                <div class="text"><h6>Fale conosco</h6><p><a href="mailto:contato@vediums.com">contato@vediums.com</a></p></div>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="main-header-one__bottom clearfix">
        <div class="container">
            <div class="main-header-one__bottom-inner clearfix">
                <nav class="main-menu main-menu--1">
                    <div class="main-menu__inner">
                        <a href="#" class="mobile-nav__toggler"><i class="fa fa-bars"></i></a>
                        <div class="left">
                            <ul class="main-menu__list">
                                <li{% if vd_page == "inicio" %} class="current"{% endif %}><a href="/">Início</a></li>
                                <li{% if vd_page == "como-funciona" %} class="current"{% endif %}><a href="/como-funciona">Como funciona</a></li>
                                <li{% if vd_page == "sobre" %} class="current"{% endif %}><a href="/sobre">Sobre</a></li>
                                <li{% if vd_page == "cursos" %} class="current"{% endif %}><a href="/catalogo">Cursos</a></li>
                                <li{% if vd_page == "faq" %} class="current"{% endif %}><a href="/faq">FAQ</a></li>
                                <li{% if vd_page == "contato" %} class="current"{% endif %}><a href="/contato">Contato</a></li>
                            </ul>
                        </div>
                        <div class="right">
                            <div class="main-menu__right">
                                <div class="main-menu__right-login-register">
                                    <ul class="list-unstyled">
                                        <li><a href="https://app.vediums.com/login">Entrar</a></li>
                                        <li><a href="https://app.vediums.com/login#signup">Registrar</a></li>
                                    </ul>
                                </div>
                                <div class="main-menu__right-cart-search">
                                    <div class="main-menu__right-search-box">
                                        <a href="/teste-de-nivel" class="thm-btn" onclick="window.dataLayer=window.dataLayer||[];window.dataLayer.push({event:'public_cta_click',location:'navbar',cta:'level_test'});">Teste grátis</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </div>
</header>
<div id="google_translate_element" style="display:none;"></div>
<style>
  .vedium-language-switcher {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-left: 12px;
    vertical-align: middle;
  }
  .vedium-language-switcher button {
    width: 31px;
    height: 31px;
    padding: 0;
    border: 1px solid #dbe3ee;
    border-radius: 999px;
    background: #fff;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(15, 23, 42, .06);
  }
  .vedium-language-switcher button.is-active {
    border-color: #2E6DA4;
    box-shadow: 0 0 0 2px rgba(46, 109, 164, .16);
  }
  .goog-te-banner-frame.skiptranslate,
  body > .skiptranslate { display: none !important; }
  body { top: 0 !important; }
  @media (max-width: 991px) {
    .vedium-language-switcher { margin: 10px 0 0; }
  }
</style>
