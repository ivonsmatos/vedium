# =====================================================
# Vedium - Docker Compose para DESENVOLVIMENTO LOCAL
# =====================================================
# Para produção, usar: deploy/docker-compose.yml
# Variáveis em .env (gerar senhas com: openssl rand -base64 32)
# =====================================================

services:
  frappe:
    build:
      context: .
      dockerfile: Dockerfile
    image: vedium-frappe:v16
    container_name: vedium-frappe
    command: sleep infinity
    environment:
      - SHELL=/bin/bash
    volumes:
      - .:/workspace:cached
      - frappe-bench-data:/home/frappe/frappe-bench
    ports:
      - "127.0.0.1:8005:8002" # Frappe Web — bind apenas localhost
      - "127.0.0.1:9005:9000" # Frappe SocketIO
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-socketio:
        condition: service_healthy
    networks:
      - vedium-network

  mariadb:
    image: mariadb:10.6
    container_name: vedium-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vedium}
      MYSQL_USER: ${MYSQL_USER:-frappe}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    # Sem ports: — acesso só pela rede interna do Docker.
    # Em dev, descomente abaixo se precisar conectar do host:
    # ports:
    #   - "127.0.0.1:3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    networks:
      - vedium-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis-cache:
    image: redis/redis-stack-server:latest
    container_name: vedium-redis-cache
    environment:
      REDIS_ARGS: "--maxmemory 256mb --maxmemory-policy allkeys-lru"
    volumes:
      - redis-cache-data:/data
    networks:
      - vedium-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-queue:
    image: redis:7-alpine
    container_name: vedium-redis-queue
    volumes:
      - redis-queue-data:/data
    networks:
      - vedium-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis-socketio:
    image: redis:7-alpine
    container_name: vedium-redis-socketio
    volumes:
      - redis-socketio-data:/data
    networks:
      - vedium-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  frappe-bench-data:
  mariadb-data:
  redis-cache-data:
  redis-queue-data:
  redis-socketio-data:

networks:
  vedium-network:
    driver: bridge
